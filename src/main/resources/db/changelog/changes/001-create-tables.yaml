                  constraints:
                    nullable: false
              - column:
                  name: prix_unitaire
                  type: DECIMAL(12,2)
                  constraints:
                    nullable: false
              - column:
                  name: sous_total
                  type: DECIMAL(12,2)
                  constraints:
                    nullable: false

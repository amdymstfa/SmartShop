databaseChangeLog:

  # ===================================
  # TABLE: users
  # ===================================
  - changeSet:
      id: 001-create-table-users
      author: microtech
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_users
              - column:
                  name: username
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_users_username
              - column:
                  name: password
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: role
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: users

  # ===================================
  # TABLE: clients
  # ===================================
  - changeSet:
      id: 001-create-table-clients
      author: microtech
      changes:
        - createTable:
            tableName: clients
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_clients
              - column:
                  name: nom
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_clients_email
              - column:
                  name: level
                  type: VARCHAR(20)
                  defaultValue: 'BASIC'
                  constraints:
                    nullable: false
              - column:
                  name: total_orders
                  type: INT
                  defaultValue: 0
                  constraints:
                    nullable: false
              - column:
                  name: total_spent
                  type: DECIMAL(12,2)
                  defaultValue: 0.00
                  constraints:
                    nullable: false
              - column:
                  name: first_order_date
                  type: TIMESTAMP
              - column:
                  name: last_order_date
                  type: TIMESTAMP
              - column:
                  name: deleted
                  type: BOOLEAN
                  defaultValue: false
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: clients

  # ===================================
  # TABLE: products
  # ===================================
  - changeSet:
      id: 001-create-table-products
      author: microtech
      changes:
        - createTable:
            tableName: products
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_products
              - column:
                  name: nom
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: prix_unitaire
                  type: DECIMAL(12,2)
                  constraints:
                    nullable: false
              - column:
                  name: stock
                  type: INT
                  defaultValue: 0
                  constraints:
                    nullable: false
              - column:
                  name: deleted
                  type: BOOLEAN
                  defaultValue: false
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: products

  # ===================================
  # TABLE: promo_codes
  # ===================================
  - changeSet:
      id: 001-create-table-promo-codes
      author: microtech
      changes:
        - createTable:
            tableName: promo_codes
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_promo_codes
              - column:
                  name: code
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_promo_codes_code
              - column:
                  name: pourcentage_remise
                  type: DECIMAL(5,2)
                  defaultValue: 5.00
                  constraints:
                    nullable: false
              - column:
                  name: date_expiration
                  type: DATE
              - column:
                  name: used
                  type: BOOLEAN
                  defaultValue: false
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: promo_codes

  # ===================================
  # TABLE: orders
  # ===================================
  - changeSet:
      id: 001-create-table-orders
      author: microtech
      changes:
        - createTable:
            tableName: orders
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_orders
              - column:
                  name: client_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: date_creation
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: sous_total_ht
                  type: DECIMAL(12,2)
                  constraints:
                    nullable: false
              - column:
                  name: montant_remise
                  type: DECIMAL(12,2)
                  defaultValue: 0.00
                  constraints:
                    nullable: false
              - column:
                  name: montant_ht_apres_remise
                  type: DECIMAL(12,2)
                  constraints:
                    nullable: false
              - column:
                  name: montant_tva
                  type: DECIMAL(12,2)
                  constraints:
                    nullable: false
              - column:
                  name: total_ttc
                  type: DECIMAL(12,2)
                  constraints:
                    nullable: false
              - column:
                  name: code_promo
                  type: VARCHAR(20)
              - column:
                  name: statut
                  type: VARCHAR(20)
                  defaultValue: 'PENDING'
                  constraints:
                    nullable: false
              - column:
                  name: montant_restant
                  type: DECIMAL(12,2)
                  constraints:
                    nullable: false
      rollback:

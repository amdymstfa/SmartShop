  # ===================================
  # TABLE: payments
  # ===================================
  - changeSet:
      id: 001-create-table-payments
      author: microtech
      changes:
        - createTable:
            tableName: payments
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_payments
              - column:
                  name: order_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: numero_paiement
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: montant
                  type: DECIMAL(12,2)
                  constraints:
                    nullable: false
              - column:
                  name: type_paiement
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: date_paiement
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: date_encaissement
                  type: TIMESTAMP
              - column:
                  name: reference
                  type: VARCHAR(100)
              - column:
                  name: banque
                  type: VARCHAR(100)
              - column:
                  name: echeance
                  type: DATE
              - column:
                  name: statut
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: payments

  # ===================================
  # TABLE: tier_history
  # ===================================
  - changeSet:
      id: 001-create-table-tier-history
      author: microtech
      changes:
        - createTable:
            tableName: tier_history



databaseChangeLog:

  # ===================================
  # SEED: users
  # ===================================
  - changeSet:
      id: 004-seed-users
      author: microtech
      context: dev,test
      changes:
        - insert:
            tableName: users
            columns:
              - column:
                  name: username
                  value: admin
              - column:
                  name: password
                  value: $2a$10$N9qo8uLOickgx2ZMRZoMyeIjZAgcfl7p92ldGxad68LJZdL17lhWy  # password: admin123
              - column:
                  name: role
                  value: ADMIN
        - insert:
            tableName: users
            columns:
              - column:
                  name: username
                  value: client1
              - column:
                  name: password
                  value: $2a$10$92IXUNpkjO0rOQ5byMi.Ye4oKoEa3Ro9llC/.og/at2.uheWG/igi  # password: client123
              - column:
                  name: role
                  value: CLIENT
        - insert:
            tableName: users
            columns:
              - column:
                  name: username
                  value: client2
              - column:
                  name: password
                  value: $2a$10$92IXUNpkjO0rOQ5byMi.Ye4oKoEa3Ro9llC/.og/at2.uheWG/igi
              - column:
                  name: role
                  value: CLIENT
      rollback:
        - delete:
            tableName: users
            where: username IN ('admin', 'client1', 'client2')

  # ===================================
  # SEED: clients (via CSV)
  # ===================================
  - changeSet:
      id: 004-seed-clients-csv
      author: microtech
      context: dev,test
      changes:
        - loadData:
            file: db/changelog/data/clients.csv
            tableName: clients
            separator: ;
            quotchar: '"'
            columns:
              - column:
                  name: id
                  type: NUMERIC
              - column:
                  name: nom
                  type: STRING
              - column:
                  name: email
                  type: STRING
              - column:
                  name: level
                  type: STRING
              - column:
                  name: total_orders
                  type: NUMERIC
              - column:
                  name: total_spent
                  type: NUMERIC
              - column:
                  name: deleted
                  type: BOOLEAN
      rollback:
        - delete:
            tableName: clients

  # ===================================
  # SEED: products (via CSV)
  # ===================================
  - changeSet:
      id: 004-seed-products-csv
      author: microtech
      context: dev,test
      changes:
        - loadData:
            file: db/changelog/data/products.csv
            tableName: products
            separator: ;
            quotchar: '"'
            columns:
              - column:
                  name: id
                  type: NUMERIC
              - column:
                  name: nom
                  type: STRING
              - column:
                  name: description
                  type: STRING
              - column:
                  name: prix_unitaire
                  type: NUMERIC
              - column:
                  name: stock
                  type: NUMERIC
              - column:
                  name: deleted
                  type: BOOLEAN
      rollback:
        - delete:
            tableName: products

  # ===================================
  # SEED: promo_codes
  # ===================================
  - changeSet:
      id: 004-seed-promo-codes
      author: microtech
      context: dev,test
      changes:
        - insert:
            tableName: promo_codes
            columns:
              - column:
                  name: code
                  value: PROMO-2025
              - column:
                  name: pourcentage_remise
                  value: 5.00
              - column:
                  name: date_expiration
                  valueDate: 2025-12-31
              - column:
                  name: used
                  valueBoolean: false
        - insert:
            tableName: promo_codes
            columns:
              - column:
                  name: code
                  value: PROMO-NOEL
              - column:
                  name: pourcentage_remise
                  value: 10.00
              - column:
                  name: date_expiration
                  valueDate: 2025-12-25
              - column:
                  name: used
                  valueBoolean: false
        - insert:
            tableName: promo_codes
            columns:
              - column:
                  name: code
                  value: PROMO-TEST
              - column:
                  name: pourcentage_remise
                  value: 5.00
              - column:
                  name: date_expiration
                  valueDate: 2026-01-31
              - column:
                  name: used
                  valueBoolean: false
      rollback:
        - delete:
            tableName: promo_codes
            where: code LIKE 'PROMO-%'
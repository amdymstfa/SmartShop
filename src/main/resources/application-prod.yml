
spring:
  # ===================================
  #DATABASE - POSTGRESQL (PROD)
  # ===================================
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smartshop_prod}
    username: ${DB_USERNAME:smartshop_user}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 20
      minimum-idle: 10
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000

  # ===================================
  # JPA / HIBERNATE
  # ===================================
  jpa:
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  # ===================================
  # LIQUIBASE
  # ===================================
  liquibase:
    enabled: true
    drop-first: false
    contexts: prod

  # ===================================
  # SESSION
  # ===================================
  servlet:
    session:
      cookie:
        secure: true
        http-only: true
        same-site: strict

# ===================================
# SERVER
# ===================================
  server:
    port: ${SERVER_PORT:8080}
    error:
      include-message: always
      include-binding-errors: never
      include-stacktrace: never
      include-exception: false
    compression:
      enabled: true
    shutdown: graceful

# ===================================
# LOGGING
# ===================================
logging:
  level:
    root: WARN
    com.microtech.smartshop: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
    liquibase: INFO
  file:
    name: /var/log/smartshop/smartshop-prod.log
    max-size: 50MB
    max-history: 30
    total-size-cap: 1GB

# ===================================
# SPRINGDOC / SWAGGER
# ===================================
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# ===================================
# CONFIGURATION MÉTIER
# ===================================
app:
  environment: production
  debug: false
  base-url: ${APP_BASE_URL:https://smartshop.microtech.ma}

# ===================================
# MANAGEMENT / ACTUATOR
# ===================================
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

# ===================================
# SÉCURITÉ
# ===================================
server:
  ssl:
    enabled: ${SSL_ENABLED:false}
    key-store: ${SSL_KEY_STORE:classpath:keystore.p12}
    key-store-password: ${SSL_KEY_STORE_PASSWORD}
    key-store-type: PKCS12